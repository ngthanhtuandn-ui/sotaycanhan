<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sổ Tay Công Việc & Lịch Ca Trực</title>
  <meta name="theme-color" content="#135d96">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root {
      --primary: #1769aa;
      --primary-dark: #124f85;
      --accent: #f59e0b;
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #172b4d;
      --muted: #62748a;
      --border: #dbe4ef;
      --success: #10b981;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --journal-bg: #fefce8;
      --journal-border: #fde047;
      --journal-text: #854d0e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at top,#eaf4ff 0%,#f5f7fb 42%,#f3f6fb 100%); color: var(--text); padding-bottom: 90px; }

    header {
      background: linear-gradient(115deg,#135d96 0%,#167bb3 60%,#2086b8 100%);
      color: white;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 6px 22px rgba(16,72,117,.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    header h1 { font-size: 0.98rem; font-weight: 800; white-space: nowrap; }
    .header-btns { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .header-btns button {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.35);
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      cursor: pointer;
      font-weight: 600;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
    }
    .header-btns button:active { background: rgba(255,255,255,0.4); transform: scale(0.96); }

    /* Nút thông báo linh động theo trạng thái */
    #btnNotiStatus {
      transition: all 0.3s ease;
      font-weight: 700;
    }
    #btnNotiStatus.is-active {
      background: #10b981 !important;
      border-color: #34d399 !important;
      color: #ffffff !important;
      box-shadow: 0 0 10px rgba(16,185,129,0.5);
    }
    #btnNotiStatus.is-denied {
      background: #ef4444 !important;
      border-color: #f87171 !important;
      color: #ffffff !important;
    }

    .container { max-width: 760px; margin: auto; padding: 12px; }

    /* Greeting Banner gọn nhẹ */
    .greeting-banner {
      background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%);
      border: 1px solid #b7efd0;
      border-radius: 18px;
      padding: 12px 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(27,86,115,.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .greeting-info { display: flex; flex-direction: column; gap: 2px; flex: 1; cursor: pointer; min-width: 0; }
    .greeting-title { font-size: 1.05rem; font-weight: 800; color: #166534; line-height: 1.3; }
    .greeting-text-sub { font-size: 0.78rem; font-weight: 600; color: #0284c7; }

    .weather-widget {
      position: relative;
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      user-select: none;
    }

    /* Icon Thời tiết Nắng */
    .sunny-animated-box { position: relative; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; }
    .sun-core {
      width: 32px; height: 32px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffde7 0%, #fde047 30%, #f59e0b 75%, #ea580c 100%);
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.7);
      animation: sunPulse 3s ease-in-out infinite alternate; z-index: 2;
    }
    .sun-rays-wrap { position: absolute; width: 100%; height: 100%; animation: sunSpin 14s linear infinite; z-index: 1; }
    .sun-beam {
      position: absolute; top: 50%; left: 50%; width: 3.5px; height: 62px; margin-left: -1.75px; margin-top: -31px;
      background: linear-gradient(to bottom, #f59e0b 0%, rgba(251,191,36,0) 25%, rgba(251,191,36,0) 75%, #f59e0b 100%);
      border-radius: 4px;
    }
    .sun-beam:nth-child(2) { transform: rotate(45deg); }
    .sun-beam:nth-child(3) { transform: rotate(90deg); }
    .sun-beam:nth-child(4) { transform: rotate(135deg); }
    @keyframes sunSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes sunPulse { 0% { transform: scale(0.92); } 100% { transform: scale(1.08); } }

    /* Icon Bóng Đêm Huyền Ảo 3D Mới */
    .night-animated-box {
      position: relative;
      width: 68px;
      height: 68px;
      background: radial-gradient(circle at 40% 40%, #1e293b 0%, #0f172a 70%, #020617 100%);
      border-radius: 50%;
      box-shadow: inset 0 0 12px rgba(15,23,42,0.9), 0 4px 12px rgba(2,6,23,0.3);
      overflow: hidden;
    }
    .night-moon-3d {
      position: absolute;
      top: 13px;
      left: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      box-shadow: 7px 5px 0 0 #fde047;
      filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.85));
      transform: rotate(-20deg);
      animation: moon3dFloat 4s ease-in-out infinite alternate;
    }
    @keyframes moon3dFloat {
      0% { transform: rotate(-20deg) scale(0.96); filter: drop-shadow(0 0 6px rgba(250, 204, 21, 0.6)); }
      100% { transform: rotate(-15deg) scale(1.04); filter: drop-shadow(0 0 14px rgba(250, 204, 21, 0.95)); }
    }
    .star-layer {
      position: absolute;
      border-radius: 50%;
      background: #ffffff;
      opacity: 0.8;
      animation: twinkle3D ease-in-out infinite alternate;
    }
    .st-far-1 { top: 12px; right: 18px; width: 2px; height: 2px; background: #93c5fd; animation-duration: 2.2s; animation-delay: 0.2s; }
    .st-far-2 { bottom: 15px; left: 16px; width: 1.5px; height: 1.5px; background: #60a5fa; animation-duration: 1.8s; animation-delay: 0.7s; }
    .st-mid-1 { top: 28px; right: 10px; width: 3px; height: 3px; background: #bae6fd; box-shadow: 0 0 4px #38bdf8; animation-duration: 3.1s; animation-delay: 0.4s; }
    .st-near-1 { bottom: 12px; right: 18px; width: 4px; height: 4px; background: #ffffff; box-shadow: 0 0 6px #67e8f9; animation-duration: 2.5s; animation-delay: 1.1s; }
    @keyframes twinkle3D {
      0% { opacity: 0.15; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    .stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
    .stat-card {
      background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px;
      box-shadow: 0 4px 14px rgba(24,55,91,.04);
    }
    .stat-label { color: var(--muted); font-size: .74rem; font-weight: 600; }
    .stat-value { font-size: 1.25rem; font-weight: 800; margin-top: 2px; }

    #alarmBanner {
      display: none; position: sticky; top: 55px; z-index: 105;
      background: linear-gradient(135deg, #0284c7, #0369a1); color: white; padding: 12px 16px;
      border-radius: 14px; margin-bottom: 14px; box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { from { transform: scale(0.99); } to { transform: scale(1.01); } }
    .alarm-content { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .alarm-title { font-weight: 800; font-size: 0.95rem; }
    .btn-stop-alarm {
      background: white; color: var(--primary); border: none; padding: 9px 18px; border-radius: 10px;
      font-weight: 800; cursor: pointer; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .nav-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
    .nav-tab-btn {
      padding: 10px 4px; border-radius: 12px; border: 1px solid var(--border); background: white;
      font-size: 0.78rem; font-weight: 700; color: var(--muted); cursor: pointer; text-align: center;
      transition: all 0.2s ease;
    }
    .nav-tab-btn.active {
      background: var(--primary); color: white; border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(23, 105, 170, 0.25);
    }

    .week-table-card { background: white; border-radius: 18px; border: 1px solid var(--border); padding: 10px; margin-bottom: 12px; }
    .week-control-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .week-dropdown-wrap { flex: 1; }
    .week-select-menu { width: 100%; background: #f8fafc; border: 1.5px solid var(--primary); color: var(--primary-dark); font-weight: 700; font-size: 0.8rem; padding: 8px 10px; border-radius: 10px; }
    .btn-copy-month { background: #f0fdf4; border: 1px solid #86efac; color: #166534; font-size: 0.72rem; font-weight: 700; padding: 8px 10px; border-radius: 10px; cursor: pointer; }

    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; margin-bottom: 10px; }
    .day-col {
      border: 1px solid var(--border); border-radius: 8px; padding: 5px 1px; background: #fafafa;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-width: 0;
    }
    .day-col.today { border-color: var(--primary); outline: 2px solid #bae6fd; }

    .day-col.is-off { background: #fee2e2 !important; border-color: #fca5a5 !important; }
    .day-col.is-off .day-name { color: #b91c1c !important; }
    .day-col.is-off .calendar-date { color: #ef4444 !important; }
    .day-col.is-off .day-shift-select { border-color: #fca5a5 !important; color: #b91c1c !important; font-weight: 800; background: #fff1f2 !important; }

    .day-col.is-ca1 { background: #e0f2fe !important; border-color: #7dd3fc !important; }
    .day-col.is-ca1 .day-name { color: #0369a1 !important; }
    .day-col.is-ca1 .calendar-date { color: #0284c7 !important; }
    .day-col.is-ca1 .day-shift-select { border-color: #38bdf8 !important; color: #0369a1 !important; font-weight: 800; background: #f0f9ff !important; }

    .day-col.is-ca2 { background: #fef9c3 !important; border-color: #fde047 !important; }
    .day-col.is-ca2 .day-name { color: #854d0e !important; }
    .day-col.is-ca2 .calendar-date { color: #a16207 !important; }
    .day-col.is-ca2 .day-shift-select { border-color: #facc15 !important; color: #854d0e !important; font-weight: 800; background: #fefce8 !important; }

    .day-name { font-size: 0.72rem; font-weight: 800; color: var(--muted); line-height: 1.1; }
    .calendar-date { display: block; font-size: .62rem; color: #64748b; margin: 2px 0 4px; font-weight: 600; }
    
    .day-shift-select {
      width: 96%; border: 1px solid var(--border); border-radius: 6px; font-size: 0.72rem;
      padding: 4px 0; font-weight: 800; text-align: center; text-align-last: center; background: #fff;
      outline: none; cursor: pointer;
    }

    .sync-calendar-panel { background: #eff6ff; border: 1.5px solid #60a5fa; border-radius: 12px; padding: 10px; margin-top: 8px; }
    .btn-sync-submit {
      width: 100%; background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none;
      padding: 10px 10px; border-radius: 8px; font-size: 0.82rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.25);
    }

    .shift-settings-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-top: 10px; }
    .shift-settings-title { font-size: 0.82rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .shift-config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .shift-config-card { background: white; padding: 8px; border-radius: 10px; border: 1px solid var(--border); }
    .shift-config-card h4 { font-size: 0.78rem; margin-bottom: 6px; color: #334155; }
    .time-input-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; font-size: 0.72rem; color: var(--muted); }
    .time-input-row span { width: 52px; font-weight: 600; }
    .time-input-row input { padding: 4px 6px; font-size: 0.75rem; border-radius: 6px; }

    .card-box {
      background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 12px;
      border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(24,55,91,.04);
    }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.78rem; font-weight: 700; margin-bottom: 4px; color: var(--muted); }
    input, select, textarea {
      width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
      font-size: 0.88rem; background: #fff; outline: none;
    }
    textarea { resize: vertical; min-height: 75px; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    .btn-submit {
      width: 100%; background: var(--primary); color: white; border: none; padding: 11px;
      border-radius: 10px; font-weight: 700; font-size: 0.88rem; cursor: pointer;
    }
    .btn-journal-submit { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); }
    .btn-submit-purple { background: var(--purple); }

    .item-card { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; }
    .card-title { font-size: 0.92rem; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .card-time { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }
    .card-desc { font-size: 0.85rem; color: #334155; white-space: pre-line; margin-bottom: 8px; }
    .card-actions { display: flex; gap: 6px; margin-top: 8px; border-top: 1px solid #f1f5f9; padding-top: 8px; }
    .btn-action {
      flex: 1; padding: 7px 4px; border-radius: 8px; border: 1px solid var(--border);
      background: #f8fafc; font-size: 0.72rem; font-weight: 700; cursor: pointer; text-align: center;
    }
    .btn-delete { color: var(--danger); border-color: #fecaca; background: #fff5f5; }

    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.94);
      color: white; padding: 10px 20px; border-radius: 24px; font-size: 0.84rem; display: none; z-index: 1000;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25); text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>📋 Sổ Tay & Báo Ca</h1>
    <div class="header-btns">
      <button onclick="testAlarmDirectly()">🔊 Thử Chuông</button>
      <button id="btnNotiStatus" onclick="toggleNotificationSetting()">🔔 Bật Báo</button>
      <button onclick="exportData()">Sao Lưu</button>
      <button onclick="document.getElementById('importFile').click()">Nhập</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </header>

  <div class="container">
    <div class="greeting-banner">
      <div class="greeting-info">
        <div class="greeting-title" id="greetingUser">Chào Tuấn Tuấn! ☀️</div>
        <div class="greeting-text-sub" id="greetingDateLabel">Đang tải ngày...</div>
      </div>
      <div class="weather-widget" id="weatherWidget" onclick="toggleWeatherDemo()"></div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">📔 Nhật ký công việc</div>
        <div class="stat-value" id="statJournals">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">⚡ Việc cần xử lý</div>
        <div class="stat-value" id="statIssues">0</div>
      </div>
    </div>

    <div id="alarmBanner">
      <div class="alarm-content">
        <div class="alarm-title" id="alarmTitle">⏰ ĐẾN GIỜ BÁO CA TRỰC!</div>
        <button class="btn-stop-alarm" onclick="stopAlarm()">✔ ĐÃ XỬ LÝ (TẮT)</button>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab-btn active" id="tabBtn-shifts" onclick="switchView('shifts')">Lịch Ca</button>
      <button class="nav-tab-btn" id="tabBtn-journal" onclick="switchView('journal')">Nhật Ký</button>
      <button class="nav-tab-btn" id="tabBtn-issues" onclick="switchView('issues')">Việc Làm</button>
      <button class="nav-tab-btn" id="tabBtn-school" onclick="switchView('school')">TKB Con</button>
    </div>

    <!-- VIEW 1: LỊCH CA -->
    <div id="view-shifts">
      <div class="week-table-card">
        <div class="week-control-bar">
          <div class="week-dropdown-wrap">
            <select id="weekDropdownSelect" class="week-select-menu" onchange="onWeekDropdownChange(this.value)"></select>
          </div>
          <button class="btn-copy-month" onclick="copyCurrentWeekToAll()">⚡ Úp Cả Tháng</button>
        </div>
        
        <div class="week-grid" id="weekGridContainer"></div>

        <div class="sync-calendar-panel">
          <button class="btn-sync-submit" onclick="syncAllShiftsToSystemCalendar()">
            📲 Nạp Vào Lịch & Hẹn Giờ Điện Thoại (Chuông khi tắt máy)
          </button>
        </div>

        <div class="shift-settings-box">
          <div class="shift-settings-title">
            <span>⚙️ Thiết lập giờ Vào / Ra từng Ca</span>
          </div>
          <div class="shift-config-grid">
            <div class="shift-config-card">
              <h4>Ca 1</h4>
              <div class="time-input-row"><span>Báo Vào:</span><input type="time" id="cfg_c1_in" onchange="saveShiftConfigs()"></div>
              <div class="time-input-row"><span>Báo Ra:</span><input type="time" id="cfg_c1_out" onchange="saveShiftConfigs()"></div>
            </div>
            <div class="shift-config-card">
              <h4>Ca 2</h4>
              <div class="time-input-row"><span>Báo Vào:</span><input type="time" id="cfg_c2_in" onchange="saveShiftConfigs()"></div>
              <div class="time-input-row"><span>Báo Ra:</span><input type="time" id="cfg_c2_out" onchange="saveShiftConfigs()"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- VIEW 2: NHẬT KÝ -->
    <div id="view-journal" style="display:none;">
      <div class="card-box" style="background:var(--journal-bg); border:1.5px solid var(--journal-border);">
        <div class="row form-group">
          <div>
            <label>Phân loại</label>
            <select id="journalCategory">
              <option value="Công việc">📝 Công việc thường nhật</option>
              <option value="Bàn giao">🤝 Bàn giao ca trực</option>
              <option value="Sự cố">⚠️ Sự việc / Lưu ý</option>
            </select>
          </div>
          <div>
            <label>Ngày ghi</label>
            <input type="date" id="journalDate">
          </div>
        </div>
        <div class="form-group">
          <label>Tiêu đề</label>
          <input type="text" id="journalTitle" placeholder="Tiêu đề nhật ký...">
        </div>
        <div class="form-group">
          <label>Nội dung chi tiết</label>
          <textarea id="journalContent" placeholder="Ghi chú cụ thể các việc..."></textarea>
        </div>
        <button class="btn-submit btn-journal-submit" onclick="saveJournalEntry()">+ Lưu Nhật Ký</button>
      </div>
      <div id="journalListContainer"></div>
    </div>

    <!-- VIEW 3: VIỆC CẦN XỬ LÝ -->
    <div id="view-issues" style="display:none;">
      <div class="card-box" style="border-left: 4px solid var(--purple);">
        <div class="form-group">
          <label>Tên công việc / Sự cố</label>
          <input type="text" id="issueTitle" placeholder="Nhập việc cần làm...">
        </div>
        <div class="row form-group">
          <div>
            <label>Mức độ</label>
            <select id="issuePriority">
              <option value="Gấp">🔴 Gấp</option>
              <option value="Bình thường" selected>🟡 Bình thường</option>
              <option value="Theo dõi">🟢 Theo dõi</option>
            </select>
          </div>
          <div>
            <label>Hẹn giờ nhắc</label>
            <input type="datetime-local" id="issueDateTime">
          </div>
        </div>
        <div class="form-group">
          <label>Hướng xử lý</label>
          <textarea id="issueContent" placeholder="Mô tả cụ thể..."></textarea>
        </div>
        <button class="btn-submit btn-submit-purple" onclick="saveIssue()">+ Lưu Công Việc</button>
      </div>
      <div id="issuesList"></div>
    </div>

    <!-- VIEW 4: THỜI KHÓA BIỂU -->
    <div id="view-school" style="display:none;">
      <div class="card-box">
        <h3 style="font-size:0.95rem; margin-bottom:10px; color:#4338ca;">🎒 Lịch học các con</h3>
        <select id="schoolClass" onchange="renderSchoolTableGrid()" style="margin-bottom:10px;">
          <option value="10">Lớp 10</option>
          <option value="6">Lớp 6</option>
        </select>
        <div id="schoolTableContainer" style="font-size:0.8rem; color:#64748b; text-align:center; padding:10px;">Đang tải bảng...</div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // --- KHỞI TẠO STATE & DỮ LIỆU ---
    let appData = {
      shiftConfigs: {
        c1_in: "06:00",
        c1_out: "14:00",
        c2_in: "14:00",
        c2_out: "22:00"
      },
      shifts: {}, // Khóa theo yyyy-mm-dd: 'Ca 1' | 'Ca 2' | 'Off'
      journals: [],
      issues: [],
      weatherMode: 'night' // Mặc định chế độ trăng sao 3D
    };

    let audioCtx = null;
    let alarmInterval = null;

    // --- SERVICE WORKER REGISTRATION (HỖ TRỢ MÀN HÌNH KHÓA) ---
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('notificationclick', e => {
          e.notification.close();
          e.waitUntil(clients.matchAll({type: 'window'}).then(clis => {
            if (clis.length > 0) return clis[0].focus();
            return clients.openWindow('./');
          }));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadSavedData();
      initDateGreeting();
      initWeekDropdown();
      renderCurrentWeek();
      renderStats();
      renderWeatherWidget();
      updateNotiButtonUI();

      // Kiểm tra chu kỳ báo thức mỗi 30s
      setInterval(checkAlarmTriggers, 30000);
    });

    // --- HỆ THỐNG ÂM THANH BÁO ĐỘNG (WEB AUDIO API CHUẨN) ---
    function playBuzzer() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Âm La (A5)
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.35);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.38);

        // Kích hoạt mô tơ rung điện thoại
        if ('vibrate' in navigator) {
          navigator.vibrate([300, 150, 300, 150, 500]);
        }
      } catch (err) {
        console.warn("Lỗi phát âm thanh:", err);
      }
    }

    function startAlarmLoop(msg) {
      document.getElementById('alarmTitle').textContent = msg;
      document.getElementById('alarmBanner').style.display = 'block';
      playBuzzer();
      if (!alarmInterval) {
        alarmInterval = setInterval(playBuzzer, 1200);
      }
    }

    function stopAlarm() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
      document.getElementById('alarmBanner').style.display = 'none';
      showToast("Đã tắt báo động");
    }

    function testAlarmDirectly() {
      playBuzzer();
      triggerSystemNotification("🔔 Kiểm tra âm thanh", "Chuông và rung hoạt động tốt!");
      showToast("Đã phát chuông & gửi thử nghiệm thông báo");
    }

    // --- THÔNG BÁO HỆ THỐNG & NÚT BẬT BÁO LINH HOẠT ---
    function updateNotiButtonUI() {
      const btn = document.getElementById('btnNotiStatus');
      if (!('Notification' in window)) {
        btn.textContent = '❌ Không Hỗ Trợ';
        return;
      }
      if (Notification.permission === 'granted') {
        btn.textContent = '🟢 Đã Bật Báo';
        btn.className = 'is-active';
      } else if (Notification.permission === 'denied') {
        btn.textContent = '🔴 Đã Chặn Báo';
        btn.className = 'is-denied';
      } else {
        btn.textContent = '🔔 Bật Báo';
        btn.className = '';
      }
    }

    async function toggleNotificationSetting() {
      if (!('Notification' in window)) {
        alert("Trình duyệt này không hỗ trợ Web Notification.");
        return;
      }
      const perm = await Notification.requestPermission();
      updateNotiButtonUI();
      if (perm === 'granted') {
        triggerSystemNotification("Bật thành công!", "Điện thoại sẽ nhận được các thông báo ca trực.");
        showToast("Đã kích hoạt quyền thông báo");
      } else {
        showToast("Quyền thông báo chưa được cấp!");
      }
    }

    function triggerSystemNotification(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(title, {
              body: body,
              icon: 'https://cdn-icons-png.flaticon.com/512/2921/2921222.png',
              badge: 'https://cdn-icons-png.flaticon.com/512/2921/2921222.png',
              vibrate: [300, 150, 300, 150, 500],
              tag: 'shift-alarm'
            });
          });
        } else {
          new Notification(title, { body: body });
        }
      }
    }

    // --- KIỂM TRA ĐỦ 4 MỐC: VÀO/RA CA 1 & VÀO/RA CA 2 ---
    let lastNotifiedMinute = "";
    function checkAlarmTriggers() {
      const now = new Date();
      const dateKey = now.toISOString().split('T')[0];
      const curHHMM = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      if (lastNotifiedMinute === curHHMM) return;

      const shiftToday = appData.shifts[dateKey];
      if (!shiftToday || shiftToday === 'Off') return;

      const cfg = appData.shiftConfigs;

      if (shiftToday === 'Ca 1') {
        if (curHHMM === cfg.c1_in) {
          triggerAlarmEvent("⏰ ĐẾN GIỜ VÀO CA 1!", "Bắt đầu ca sáng: " + cfg.c1_in);
          lastNotifiedMinute = curHHMM;
        } else if (curHHMM === cfg.c1_out) {
          triggerAlarmEvent("🎉 HẾT GIỜ CA 1 (TAN CA)!", "Hoàn thành ca sáng: " + cfg.c1_out);
          lastNotifiedMinute = curHHMM;
        }
      } else if (shiftToday === 'Ca 2') {
        if (curHHMM === cfg.c2_in) {
          triggerAlarmEvent("⏰ ĐẾN GIỜ VÀO CA 2!", "Bắt đầu ca chiều/tối: " + cfg.c2_in);
          lastNotifiedMinute = curHHMM;
        } else if (curHHMM === cfg.c2_out) {
          triggerAlarmEvent("🎉 HẾT GIỜ CA 2 (TAN CA)!", "Hoàn thành ca chiều: " + cfg.c2_out);
          lastNotifiedMinute = curHHMM;
        }
      }
    }

    function triggerAlarmEvent(title, msg) {
      startAlarmLoop(title);
      triggerSystemNotification(title, msg);
    }

    // --- NẠP VÀO LỊCH HỆ THỐNG ĐIỆN THOẠI (ICS FILE) ---
    // Giúp điện thoại rung chuông báo thức chính xác ngay cả khi tắt màn hình
    function syncAllShiftsToSystemCalendar() {
      let icsEvents = [];
      const keys = Object.keys(appData.shifts);
      if (keys.length === 0) {
        showToast("Chưa có lịch ca nào để đồng bộ!");
        return;
      }

      const cfg = appData.shiftConfigs;

      keys.forEach(dtStr => {
        const type = appData.shifts[dtStr];
        if (type === 'Off') return;

        const cleanDate = dtStr.replace(/-/g, '');
        const inTime = (type === 'Ca 1' ? cfg.c1_in : cfg.c2_in).replace(':', '') + '00';
        const outTime = (type === 'Ca 1' ? cfg.c1_out : cfg.c2_out).replace(':', '') + '00';

        // Sự kiện Vào Ca (Kèm báo thức trước 15 phút)
        icsEvents.push(`BEGIN:VEVENT
SUMMARY:⏰ Vào ${type}
DESCRIPTION:Ca làm việc: Vào lúc ${type === 'Ca 1' ? cfg.c1_in : cfg.c2_in}
DTSTART:${cleanDate}T${inTime}
DTEND:${cleanDate}T${inTime}
BEGIN:VALARM
TRIGGER:-PT15M
ACTION:DISPLAY
DESCRIPTION:Nhắc nhở chuẩn bị vào ca
END:VALARM
END:VEVENT`);

        // Sự kiện Tan Ca
        icsEvents.push(`BEGIN:VEVENT
SUMMARY:🎉 Tan ${type}
DESCRIPTION:Kết thúc ca trực lúc ${type === 'Ca 1' ? cfg.c1_out : cfg.c2_out}
DTSTART:${cleanDate}T${outTime}
DTEND:${cleanDate}T${outTime}
BEGIN:VALARM
TRIGGER:-PT0M
ACTION:DISPLAY
DESCRIPTION:Đã đến giờ tan ca!
END:VALARM
END:VEVENT`);
      });

      const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//So Tay Cong Viec//Shift Schedule//VI
CALSCALE:GREGORIAN
${icsEvents.join('\n')}
END:VCALENDAR`;

      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute('download', 'Lich_Ca_Truc.ics');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("Đã tải tệp Lịch! Hãy mở tệp để nạp vào Calendar điện thoại.");
    }

    // --- HIỆU ỨNG THỜI TIẾT 3D (ĐÊM HUYỀN ẢO & NẮNG) ---
    function renderWeatherWidget() {
      const box = document.getElementById('weatherWidget');
      if (appData.weatherMode === 'night') {
        box.innerHTML = `
          <div class="night-animated-box" title="Đêm sao huyền ảo">
            <div class="night-moon-3d"></div>
            <div class="star-layer st-far-1"></div>
            <div class="star-layer st-far-2"></div>
            <div class="star-layer st-mid-1"></div>
            <div class="star-layer st-near-1"></div>
          </div>
        `;
      } else {
        box.innerHTML = `
          <div class="sunny-animated-box" title="Trời nắng trong lành">
            <div class="sun-rays-wrap">
              <div class="sun-beam"></div><div class="sun-beam"></div>
              <div class="sun-beam"></div><div class="sun-beam"></div>
            </div>
            <div class="sun-core"></div>
          </div>
        `;
      }
    }

    function toggleWeatherDemo() {
      appData.weatherMode = appData.weatherMode === 'night' ? 'sunny' : 'night';
      renderWeatherWidget();
      saveData();
    }

    // --- XỬ LÝ LỊCH CA & TUẦN ---
    function initDateGreeting() {
      const now = new Date();
      const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
      document.getElementById('greetingDateLabel').textContent = 
        `Hôm nay ${days[now.getDay()]}, ${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
      
      document.getElementById('journalDate').value = now.toISOString().split('T')[0];
    }

    let currentWeekOffset = 0;
    function initWeekDropdown() {
      const select = document.getElementById('weekDropdownSelect');
      select.innerHTML = '';
      for (let i = -2; i <= 6; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i === 0 ? "Tuần Hiện Tại" : (i > 0 ? `Tuần kế tiếp (+${i})` : `Tuần trước (${i})`);
        if (i === 0) opt.selected = true;
        select.appendChild(opt);
      }
    }

    function onWeekDropdownChange(val) {
      currentWeekOffset = parseInt(val);
      renderCurrentWeek();
    }

    function renderCurrentWeek() {
      const container = document.getElementById('weekGridContainer');
      container.innerHTML = '';

      const curr = new Date();
      const first = curr.getDate() - curr.getDay() + 1 + (currentWeekOffset * 7); // Thứ 2
      const dayNames = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];

      const todayIso = new Date().toISOString().split('T')[0];

      for (let i = 0; i < 7; i++) {
        const d = new Date(curr.getFullYear(), curr.getMonth(), first + i);
        const iso = d.toISOString().split('T')[0];
        const val = appData.shifts[iso] || 'Ca 1';

        let colClass = "day-col";
        if (iso === todayIso) colClass += " today";
        if (val === 'Ca 1') colClass += " is-ca1";
        if (val === 'Ca 2') colClass += " is-ca2";
        if (val === 'Off') colClass += " is-off";

        const col = document.createElement('div');
        col.className = colClass;
        col.innerHTML = `
          <div class="day-name">${dayNames[i]}</div>
          <span class="calendar-date">${d.getDate()}/${d.getMonth()+1}</span>
          <select class="day-shift-select" onchange="onShiftChange('${iso}', this.value)">
            <option value="Ca 1" ${val==='Ca 1'?'selected':''}>C1</option>
            <option value="Ca 2" ${val==='Ca 2'?'selected':''}>C2</option>
            <option value="Off" ${val==='Off'?'selected':''}>Nghỉ</option>
          </select>
        `;
        container.appendChild(col);
      }
    }

    function onShiftChange(iso, val) {
      appData.shifts[iso] = val;
      saveData();
      renderCurrentWeek();
    }

    function copyCurrentWeekToAll() {
      const curr = new Date();
      const first = curr.getDate() - curr.getDay() + 1 + (currentWeekOffset * 7);
      let pattern = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(curr.getFullYear(), curr.getMonth(), first + i);
        pattern.push(appData.shifts[d.toISOString().split('T')[0]] || 'Ca 1');
      }

      // Áp dụng tuần này cho 4 tuần kế tiếp
      for (let w = 1; w <= 4; w++) {
        for (let i = 0; i < 7; i++) {
          const d = new Date(curr.getFullYear(), curr.getMonth(), first + (w * 7) + i);
          appData.shifts[d.toISOString().split('T')[0]] = pattern[i];
        }
      }
      saveData();
      showToast("Đã nhân bản lịch tuần cho cả tháng!");
    }

    function saveShiftConfigs() {
      appData.shiftConfigs.c1_in = document.getElementById('cfg_c1_in').value;
      appData.shiftConfigs.c1_out = document.getElementById('cfg_c1_out').value;
      appData.shiftConfigs.c2_in = document.getElementById('cfg_c2_in').value;
      appData.shiftConfigs.c2_out = document.getElementById('cfg_c2_out').value;
      saveData();
      showToast("Đã lưu thiết lập giờ ca!");
    }

    // --- QUẢN LÝ NHẬT KÝ & CÔNG VIỆC ---
    function saveJournalEntry() {
      const title = document.getElementById('journalTitle').value.trim();
      const content = document.getElementById('journalContent').value.trim();
      const date = document.getElementById('journalDate').value;
      const cat = document.getElementById('journalCategory').value;

      if (!title) { alert("Vui lòng nhập tiêu đề!"); return; }

      appData.journals.unshift({ id: Date.now(), title, content, date, cat });
      document.getElementById('journalTitle').value = '';
      document.getElementById('journalContent').value = '';
      saveData();
      renderJournals();
      renderStats();
      showToast("Đã thêm nhật ký!");
    }

    function renderJournals() {
      const list = document.getElementById('journalListContainer');
      list.innerHTML = '';
      appData.journals.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `
          <div class="card-top">
            <span class="badge" style="background:#fef08a; color:#854d0e;">${item.cat}</span>
            <span class="card-time">${item.date}</span>
          </div>
          <div class="card-title">${item.title}</div>
          <div class="card-desc">${item.content}</div>
          <div class="card-actions">
            <button class="btn-action btn-delete" onclick="deleteJournal(${item.id})">Xóa</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function deleteJournal(id) {
      appData.journals = appData.journals.filter(j => j.id !== id);
      saveData();
      renderJournals();
      renderStats();
    }

    function saveIssue() {
      const title = document.getElementById('issueTitle').value.trim();
      const prio = document.getElementById('issuePriority').value;
      const dt = document.getElementById('issueDateTime').value;
      const content = document.getElementById('issueContent').value.trim();

      if (!title) { alert("Vui lòng nhập tên công việc!"); return; }

      appData.issues.unshift({ id: Date.now(), title, prio, dt, content, done: false });
      document.getElementById('issueTitle').value = '';
      document.getElementById('issueContent').value = '';
      saveData();
      renderIssues();
      renderStats();
      showToast("Đã thêm việc cần xử lý!");
    }

    function renderIssues() {
      const list = document.getElementById('issuesList');
      list.innerHTML = '';
      appData.issues.forEach(it => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `
          <div class="card-top">
            <span class="badge" style="background:#ede9fe; color:#5b21b6;">${it.prio}</span>
            <span class="card-time">${it.dt || 'Không hẹn giờ'}</span>
          </div>
          <div class="card-title">${it.title}</div>
          <div class="card-desc">${it.content}</div>
          <div class="card-actions">
            <button class="btn-action btn-delete" onclick="deleteIssue(${it.id})">Xóa</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function deleteIssue(id) {
      appData.issues = appData.issues.filter(i => i.id !== id);
      saveData();
      renderIssues();
      renderStats();
    }

    function renderStats() {
      document.getElementById('statJournals').textContent = appData.journals.length;
      document.getElementById('statIssues').textContent = appData.issues.length;
    }

    function renderSchoolTableGrid() {
      const cls = document.getElementById('schoolClass').value;
      document.getElementById('schoolTableContainer').innerHTML = 
        `<div style="padding:15px; background:#f8fafc; border-radius:10px;">Thời khóa biểu mẫu cho lớp ${cls} (Thứ 2 - Thứ 7)</div>`;
    }

    function switchView(tab) {
      ['shifts', 'journal', 'issues', 'school'].forEach(t => {
        document.getElementById(`view-${t}`).style.display = (t === tab ? 'block' : 'none');
        document.getElementById(`tabBtn-${t}`).className = `nav-tab-btn ${t === tab ? 'active' : ''}`;
      });
      if (tab === 'journal') renderJournals();
      if (tab === 'issues') renderIssues();
      if (tab === 'school') renderSchoolTableGrid();
    }

    // --- LƯU TRỮ VÀ XUẤT NHẬP DỮ LIỆU ---
    function saveData() {
      localStorage.setItem('shiftAppData', JSON.stringify(appData));
    }

    function loadSavedData() {
      const raw = localStorage.getItem('shiftAppData');
      if (raw) {
        try {
          appData = Object.assign(appData, JSON.parse(raw));
        } catch (e) {
          console.error(e);
        }
      }
      document.getElementById('cfg_c1_in').value = appData.shiftConfigs.c1_in;
      document.getElementById('cfg_c1_out').value = appData.shiftConfigs.c1_out;
      document.getElementById('cfg_c2_in').value = appData.shiftConfigs.c2_in;
      document.getElementById('cfg_c2_out').value = appData.shiftConfigs.c2_out;
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
      const el = document.createElement('a');
      el.setAttribute("href", dataStr);
      el.setAttribute("download", `SoTay_Backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(el);
      el.click();
      el.remove();
      showToast("Đã tạo tệp sao lưu!");
    }

    function importData(ev) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          appData = JSON.parse(e.target.result);
          saveData();
          loadSavedData();
          renderCurrentWeek();
          renderStats();
          showToast("Nhập dữ liệu thành công!");
        } catch(err) {
          alert("Tệp sao lưu không đúng định dạng!");
        }
      };
      reader.readAsText(ev.target.files[0]);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2600);
    }
  </script>
</body>
</html>
