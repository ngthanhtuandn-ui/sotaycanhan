<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sổ Tay Công Việc & Thời Khóa Biểu Gia Đình</title>
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2921/2921222.png">

  <style>
    :root {
      --primary: #1769aa;
      --primary-dark: #124f85;
      --accent: #f59e0b;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --success: #10b981;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --journal-bg: #fffbeb;
      --journal-border: #fde68a;
      --journal-text: #854d0e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at top,#e0f2fe 0%,#f8fafc 45%,#f1f5f9 100%); color: var(--text); padding-bottom: 90px; }

    header {
      background: linear-gradient(115deg,#0369a1 0%,#0284c7 60%,#0ea5e9 100%);
      color: white;
      padding: 10px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.25);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    header h1 { font-size: 0.94rem; font-weight: 800; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
    .header-btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .header-btns button {
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 0.7rem;
      cursor: pointer;
      font-weight: 600;
      backdrop-filter: blur(6px);
      transition: all 0.15s ease;
    }
    .header-btns button:active { background: rgba(255,255,255,0.45); transform: scale(0.96); }

    .container { max-width: 860px; margin: auto; padding: 12px 10px 24px; }

    /* BANNER LỜI CHÀO & ICON THỜI TIẾT ĐỘNG */
    .greeting-banner {
      background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%);
      border: 1.5px solid #86efac;
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .greeting-info { display: flex; flex-direction: column; gap: 2px; }
    .greeting-text-main { font-size: 0.95rem; font-weight: 800; color: #166534; }
    .greeting-text-sub { font-size: 0.78rem; font-weight: 600; color: #047857; }
    .weather-status-text { font-size: 0.72rem; color: #64748b; font-weight: 600; }

    /* ICON THỜI TIẾT ANIMATED */
    .weather-widget {
      position: relative;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 1. Nắng */
    .sun-icon {
      width: 28px; height: 28px; border-radius: 50%; position: relative;
      background: radial-gradient(circle at 35% 30%, #fffbeb 0%, #f59e0b 60%, #d97706 100%);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.6);
      animation: sunPulse 3s ease-in-out infinite alternate;
    }
    .sun-icon::before {
      content: ''; position: absolute; inset: -7px; border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, rgba(245, 158, 11, 0.8) 0deg 10deg, transparent 10deg 30deg);
      animation: sunSpin 18s linear infinite;
      z-index: -1;
    }
    @keyframes sunPulse { 0% { transform: scale(0.92); } 100% { transform: scale(1.08); } }
    @keyframes sunSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* 2. Có mây */
    .partly-cloudy { position: relative; width: 40px; height: 34px; }
    .partly-cloudy .sun-small {
      width: 18px; height: 18px; background: #f59e0b; border-radius: 50%;
      position: absolute; top: 1px; right: 2px;
      box-shadow: 0 0 8px #fde047;
      animation: floatSun 2.8s ease-in-out infinite alternate;
    }
    .partly-cloudy .cloud-front {
      width: 30px; height: 16px; background: #cbd5e1; border-radius: 12px;
      position: absolute; bottom: 1px; left: 1px;
      animation: floatCloud 3.2s ease-in-out infinite alternate;
    }
    .partly-cloudy .cloud-front::before {
      content: ''; position: absolute; width: 14px; height: 14px; background: #cbd5e1; border-radius: 50%; top: -6px; left: 5px;
    }
    @keyframes floatCloud { 0% { transform: translateX(0); } 100% { transform: translateX(4px); } }
    @keyframes floatSun { 0% { transform: translateY(0); } 100% { transform: translateY(-3px); } }

    /* 3. Mưa */
    .rainy-icon { position: relative; width: 38px; height: 36px; }
    .rain-cloud {
      width: 32px; height: 16px; background: #94a3b8; border-radius: 12px;
      position: absolute; top: 2px; left: 3px;
      animation: floatCloud 2.5s ease-in-out infinite alternate;
    }
    .rain-cloud::before {
      content: ''; position: absolute; width: 14px; height: 14px; background: #94a3b8; border-radius: 50%; top: -6px; left: 6px;
    }
    .rain-drop { position: absolute; width: 2px; height: 6px; background: #0284c7; border-radius: 2px; animation: rainDropFall 0.75s linear infinite; }
    .rain-drop.d1 { left: 8px; bottom: 1px; animation-delay: 0s; }
    .rain-drop.d2 { left: 16px; bottom: 3px; animation-delay: 0.25s; }
    .rain-drop.d3 { left: 24px; bottom: 0px; animation-delay: 0.45s; }
    @keyframes rainDropFall { 0% { transform: translateY(-4px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(8px); opacity: 0; } }

    /* 4. Trăng Đêm */
    .night-icon-wrap { position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
    .moon-crescent {
      width: 22px; height: 22px; border-radius: 50%;
      box-shadow: 6px 3px 0 0 #facc15;
      animation: moonSway 3s ease-in-out infinite alternate;
    }
    .star-twinkle {
      position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%;
      box-shadow: 0 0 4px #fff; animation: starBlink 1.4s ease-in-out infinite alternate;
    }
    .star1 { top: 5px; right: 5px; }
    .star2 { bottom: 6px; left: 5px; animation-delay: 0.7s; }
    @keyframes moonSway { 0% { transform: rotate(-5deg); filter: drop-shadow(0 0 3px #fde047); } 100% { transform: rotate(5deg); filter: drop-shadow(0 0 8px #facc15); } }
    @keyframes starBlink { 0% { opacity: 0.2; transform: scale(0.6); } 100% { opacity: 1; transform: scale(1.3); } }

    /* BẢNG ĐIỀU HƯỚNG TAB TINH GỌN */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-bottom: 12px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 12px;
    }
    .nav-tab-btn {
      padding: 8px 4px;
      border-radius: 9px;
      border: none;
      background: transparent;
      font-size: 0.76rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.18s ease;
    }
    .nav-tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgba(23, 105, 170, 0.25);
    }
    .nav-tab-btn.active-journal {
      background: #fef08a !important;
      color: #854d0e !important;
      box-shadow: 0 2px 8px rgba(202, 138, 4, 0.25) !important;
    }

    .card-box {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
    }

    /* LƯỚI LỊCH & FIX LỖI MÀU ĐỎ NGÀY NGHỈ (OFF) */
    .week-table-card {
      background: white;
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
    }
    .week-control-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .week-select-menu {
      flex: 1;
      background: #f8fafc;
      border: 1.5px solid var(--primary);
      color: var(--primary-dark);
      font-weight: 750;
      font-size: 0.82rem;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-copy-month {
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #166534;
      font-size: 0.74rem;
      font-weight: 750;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-bottom: 10px; }
    .day-col {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 2px;
      background: #fafafa;
      transition: all 0.2s ease;
    }
    .day-col.today { outline: 2px solid #38bdf8; }

    /* FIX MÀU ĐỎ NỔI BẬT CHO NGÀY OFF */
    .day-col.is-off {
      background-color: #fee2e2 !important;
      border: 1.5px solid #f87171 !important;
    }
    .day-col.is-off .day-name { color: #dc2626 !important; font-weight: 800 !important; }
    .day-col.is-off .calendar-date { color: #ef4444 !important; font-weight: 700 !important; }
    .day-col.is-off .day-shift-select {
      border-color: #fca5a5 !important;
      color: #b91c1c !important;
      background: #ffffff !important;
      font-weight: 800 !important;
    }

    /* MÀU CHO CA 1 */
    .day-col.is-ca1 { background-color: #e0f2fe !important; border: 1.5px solid #38bdf8 !important; }
    .day-col.is-ca1 .day-name { color: #0284c7 !important; font-weight: 800; }
    .day-col.is-ca1 .calendar-date { color: #0369a1 !important; font-weight: 700; }
    .day-col.is-ca1 .day-shift-select { border-color: #7dd3fc !important; color: #0369a1 !important; background: #fff !important; font-weight: 800; }

    /* MÀU CHO CA 2 */
    .day-col.is-ca2 { background-color: #fef9c3 !important; border: 1.5px solid #facc15 !important; }
    .day-col.is-ca2 .day-name { color: #b45309 !important; font-weight: 800; }
    .day-col.is-ca2 .calendar-date { color: #d97706 !important; font-weight: 700; }
    .day-col.is-ca2 .day-shift-select { border-color: #fde047 !important; color: #92400e !important; background: #fff !important; font-weight: 800; }

    .day-name { font-size: 0.72rem; font-weight: 750; color: #64748b; }
    .calendar-date { display: block; font-size: 0.62rem; color: #64748b; margin: 2px 0 4px; }
    .day-shift-select {
      width: 100%; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.72rem; padding: 4px 0; font-weight: 750; text-align: center; background: #fff;
    }

    /* NÚT ĐỒNG BỘ */
    .sync-calendar-panel { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; margin-top: 8px; }
    .sync-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .custom-multiselect { flex: 1.2; position: relative; min-width: 150px; }
    .multiselect-toggle-btn {
      width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.76rem; font-weight: 750; padding: 8px 10px; color: #334155; text-align: left;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .multiselect-dropdown {
      display: none; position: absolute; bottom: calc(100% + 4px); left: 0; right: 0;
      background: #fff; border: 1.5px solid var(--primary); border-radius: 9px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12); z-index: 200; padding: 4px 0; max-height: 200px; overflow-y: auto;
    }
    .multiselect-dropdown.show { display: block; }
    .multiselect-item { display: flex; justify-content: space-between; padding: 7px 10px; font-size: 0.76rem; font-weight: 650; cursor: pointer; }
    .multiselect-item.selected { background: #eff6ff; color: var(--primary-dark); font-weight: 750; }
    .multiselect-check { color: var(--primary); display: none; }
    .multiselect-item.selected .multiselect-check { display: inline-block; }

    .sync-actions-group { display: flex; gap: 6px; flex: 1.5; }
    .btn-sync-submit {
      flex: 1; background: linear-gradient(135deg, #0284c7, #0369a1); color: white;
      border: none; padding: 8px 6px; border-radius: 8px; font-size: 0.74rem; font-weight: 750; cursor: pointer; text-align: center;
    }
    .btn-sync-split {
      background: #ecfdf5; border: 1px solid #86efac; color: #065f46;
      padding: 8px 8px; border-radius: 8px; font-size: 0.72rem; font-weight: 750; cursor: pointer; white-space: nowrap;
    }

    /* THỜI KHÓA BIỂU & MÀU SẮC TỪNG TIẾT */
    .timetable-lesson-grid { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 12px; }
    .lesson-input-row { display: grid; grid-template-columns: 80px minmax(0,1fr); gap: 6px; align-items: center; }
    .lesson-tag {
      padding: 9px 4px; border-radius: 9px; font-size: 0.76rem; font-weight: 800; text-align: center;
    }
    .tag-t1 { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .tag-t2 { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .tag-t3 { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .tag-t4 { background: #fce7f3; color: #be185d; border: 1px solid #fbcfe8; }
    .tag-t5 { background: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; }

    /* HUY HIỆU VÀNG NHẠT Ở PHẦN XEM NHANH */
    .quick-lesson-badge {
      display: inline-block;
      background: #fef9c3;
      color: #854d0e;
      border: 1px solid #fde047;
      font-weight: 800;
      font-size: 0.74rem;
      padding: 2px 7px;
      border-radius: 6px;
      margin-right: 6px;
      box-shadow: 0 1px 2px rgba(133, 77, 14, 0.08);
      white-space: nowrap;
    }
    .quick-lesson-item {
      display: flex;
      align-items: center;
      padding: 4px 0;
      font-size: 0.83rem;
      color: #1e293b;
    }

    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.76rem; font-weight: 700; margin-bottom: 3px; color: var(--muted); }
    input, select, textarea {
      width: 100%; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border);
      font-size: 0.84rem; background: #fff; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }

    .btn-submit {
      width: 100%; background: var(--primary); color: white; border: none; padding: 10px;
      border-radius: 9px; font-weight: 750; font-size: 0.85rem; cursor: pointer;
    }
    .btn-submit-purple { background: var(--purple); }

    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94); color: white; padding: 8px 16px;
      border-radius: 18px; font-size: 0.8rem; display: none; z-index: 1000;
    }

    @media(max-width:560px) {
      .sync-actions-group { flex-direction: column; width: 100%; }
      .header-btns button { padding: 5px 6px; font-size: 0.65rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>📋 Sổ Tay & Lịch Ca Trực</h1>
    <div class="header-btns">
      <button onclick="enableSoundTest()">🔊 Thử Chuông</button>
      <button onclick="requestNotificationPermission()">🔔 Báo</button>
      <button onclick="exportData()">Sao Lưu</button>
      <button onclick="document.getElementById('importFile').click()">Nhập</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </header>

  <div class="container">
    <!-- BANNER LỜI CHÀO & ICON THỜI TIẾT ĐỘNG -->
    <div class="greeting-banner">
      <div class="greeting-info">
        <div class="greeting-text-main">Xin chào Tuấn Tuấn ✨</div>
        <div class="greeting-text-sub" id="greetingDateLabel">Đang tải ngày...</div>
        <div class="weather-status-text" id="weatherStatusLabel">Đang tải thời tiết...</div>
      </div>
      <div class="weather-widget" id="weatherWidget" onclick="cycleWeatherDemo()" title="Chạm để chuyển thời tiết thử nghiệm"></div>
    </div>

    <!-- TABS ĐIỀU HƯỚNG GỌN GÀNG -->
    <div class="nav-tabs">
      <button class="nav-tab-btn active" id="tabBtn-shifts" onclick="switchView('shifts')">📅 Lịch Ca</button>
      <button class="nav-tab-btn" id="tabBtn-journal" onclick="switchView('journal')">📔 Nhật Ký</button>
      <button class="nav-tab-btn" id="tabBtn-issues" onclick="switchView('issues')">⚡ Việc Làm</button>
      <button class="nav-tab-btn" id="tabBtn-school" onclick="switchView('school')">🎒 Thời Khóa Biểu</button>
    </div>

    <!-- VIEW 1: LỊCH CA -->
    <div id="view-shifts">
      <div class="week-table-card">
        <div class="week-control-bar">
          <select id="weekDropdownSelect" class="week-select-menu" onchange="onWeekDropdownChange(this.value)"></select>
          <button class="btn-copy-month" onclick="copyCurrentWeekToAll()" title="Áp dụng tuần này cho cả tháng">⚡ Cả Tháng</button>
        </div>
        
        <div class="week-grid" id="weekGridContainer"></div>

        <div class="sync-calendar-panel">
          <div style="font-size:0.74rem; font-weight:700; color:#475569; margin-bottom:5px;">
            📲 Nạp Google Lịch điện thoại:
          </div>
          <div class="sync-row">
            <div class="custom-multiselect">
              <button class="multiselect-toggle-btn" id="syncDropdownToggle" onclick="toggleSyncDropdown(event)">
                <span id="syncDropdownLabel">Đồng bộ lịch tuần...</span>
                <span style="font-size:0.65rem; color:var(--muted);">▲</span>
              </button>
              <div class="multiselect-dropdown" id="syncDropdownMenu"></div>
            </div>
            <div class="sync-actions-group">
              <button class="btn-sync-submit" onclick="executeSelectedSync('all')" title="Gắn chấm tròn màu trực quan 🔵/🟡">
                📲 Nạp Google Lịch (Chuẩn Màu)
              </button>
              <button class="btn-sync-split" onclick="exportSplitCalendars()" title="Tách 2 file Ca 1 & Ca 2 riêng biệt">
                ⚡ Tách 2 Lịch Riêng
              </button>
            </div>
          </div>
        </div>

        <div style="background:#f8fafc; border:1px solid var(--border); border-radius:12px; padding:10px; margin-top:10px;">
          <div style="font-size:0.78rem; font-weight:750; color:var(--primary-dark); margin-bottom:6px;">
            ⚙️ Giờ Báo Ca (Tự động lưu)
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <div style="background:#fff; padding:8px; border-radius:8px; border:1px solid var(--border);">
              <div style="font-size:0.76rem; font-weight:750; color:#0369a1; margin-bottom:4px;">🔵 Ca 1 (Sáng)</div>
              <div class="row" style="font-size:0.72rem; align-items:center; margin-bottom:4px;"><span>In:</span><input type="time" id="cfg_c1_in" onchange="updateShiftTimeConfig()"></div>
              <div class="row" style="font-size:0.72rem; align-items:center;"><span>Out:</span><input type="time" id="cfg_c1_out" onchange="updateShiftTimeConfig()"></div>
            </div>
            <div style="background:#fff; padding:8px; border-radius:8px; border:1px solid var(--border);">
              <div style="font-size:0.76rem; font-weight:750; color:#b45309; margin-bottom:4px;">🟡 Ca 2 (Chiều)</div>
              <div class="row" style="font-size:0.72rem; align-items:center; margin-bottom:4px;"><span>In:</span><input type="time" id="cfg_c2_in" onchange="updateShiftTimeConfig()"></div>
              <div class="row" style="font-size:0.72rem; align-items:center;"><span>Out:</span><input type="time" id="cfg_c2_out" onchange="updateShiftTimeConfig()"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- VIEW 2: NHẬT KÝ -->
    <div id="view-journal" style="display:none;">
      <div class="card-box" style="background:var(--journal-bg); border-color:var(--journal-border);">
        <div style="font-size:0.88rem; font-weight:800; color:var(--journal-text); margin-bottom:8px;">✍️ Ghi Nhật Ký Công Việc</div>
        <div class="row form-group">
          <div>
            <label>Phân loại</label>
            <select id="journalCategory">
              <option value="viec-ngay">📝 Thường nhật</option>
              <option value="ban-giao">🤝 Bàn giao</option>
              <option value="su-co">⚠️ Sự việc</option>
              <option value="ghi-chu">💡 Ghi nhớ</option>
            </select>
          </div>

            <option value="1">Thứ Hai</option><option value="2">Thứ Ba</option><option value="3">Thứ Tư</option>
            <option value="4">Thứ Năm</option><option value="5">Thứ Sáu</option><option value="6">Thứ Bảy</option><option value="0">Chủ Nhật</option>
          </select>

        <!-- CÁC TIẾT HỌC MỖI TIẾT 1 MÀU KHÁC NHAU -->
        <div id="schoolLessons" class="timetable-lesson-grid"></div>

        <button class="btn-submit" onclick="saveSchoolTimetable()">💾 Lưu Thời Khóa Biểu</button>

        <h3 style="font-size:0.86rem; margin-bottom:8px; color:#1e293b;">📌 Xem Nhanh Hôm Nay</h3>

  <div id="toast">Thông báo</div>

  <script>
    let journals = JSON.parse(localStorage.getItem('camp_journals_v1') || localStorage.getItem('camp_reports_v2') || '[]');
    let issues = JSON.parse(localStorage.getItem('camp_issues_v2') || '[]');
    let shiftTimes = JSON.parse(localStorage.getItem('camp_shift_times') || JSON.stringify({
      c1_in: '05:15', c1_out: '14:00', c2_in: '13:15', c2_out: '22:00'
    }));

    let monthWeeksList = [];
    let currentWeekIndex = 0;
    let selectedSyncWeeks = new Set();
    let audioCtx = null;

    // 1. ANIMATED WEATHER
    const weatherStates = [
      { type: 'sunny', label: 'Trời nắng rực rỡ' },
      { type: 'partly-cloudy', label: 'Trời dịu mát, có mây' },
      { type: 'rainy', label: 'Trời đang có mưa' },
      { type: 'night', label: 'Trời đêm quang đãng' }
    ];
    let currentWeatherIndex = 0;

    function renderWeatherIcon(type) {
      const widget = document.getElementById('weatherWidget');
      const label = document.getElementById('weatherStatusLabel');
      if (!widget) return;

      if (type === 'sunny') {
        widget.innerHTML = `<div class="sun-icon"></div>`;
        if (label) label.innerText = '☀️ Trời nắng rực rỡ';
      } else if (type === 'partly-cloudy') {
        widget.innerHTML = `
          <div class="partly-cloudy">
            <div class="sun-small"></div>
            <div class="cloud-front"></div>
          </div>`;
        if (label) label.innerText = '⛅ Trời dịu mát, có mây';
      } else if (type === 'rainy') {
        widget.innerHTML = `
          <div class="rainy-icon">
            <div class="rain-cloud"></div>
            <div class="rain-drop d1"></div>
            <div class="rain-drop d2"></div>
            <div class="rain-drop d3"></div>
          </div>`;
        if (label) label.innerText = '🌧️ Trời đang có mưa';
      } else {
        widget.innerHTML = `
          <div class="night-icon-wrap">
            <div class="moon-crescent"></div>
            <div class="star-twinkle star1"></div>
            <div class="star-twinkle star2"></div>
          </div>`;
        if (label) label.innerText = '🌙 Trời đêm quang đãng';
      }
    }

    function cycleWeatherDemo() {
      currentWeatherIndex = (currentWeatherIndex + 1) % weatherStates.length;
      renderWeatherIcon(weatherStates[currentWeatherIndex].type);
      showToast(weatherStates[currentWeatherIndex].label);
    }

    // 2. CHUYỂN TAB
    function switchView(tab) {
      ['shifts', 'journal', 'issues', 'school'].forEach(t => {
        const v = document.getElementById(`view-${t}`);
        const b = document.getElementById(`tabBtn-${t}`);
        if (v) v.style.display = (t === tab) ? 'block' : 'none';
        if (b) {
          b.classList.remove('active', 'active-journal');
          if (t === tab) {
            if (t === 'journal') b.classList.add('active-journal');
            else b.classList.add('active');
          }
        }
      });
    }

    // 3. LỊCH CA & FIX LỖI MÀU ĐỎ NGÀY OFF
    function loadShiftTimeConfigUI() {
      document.getElementById('cfg_c1_in').value = shiftTimes.c1_in || '05:15';
      document.getElementById('cfg_c1_out').value = shiftTimes.c1_out || '14:00';
      document.getElementById('cfg_c2_in').value = shiftTimes.c2_in || '13:15';
      document.getElementById('cfg_c2_out').value = shiftTimes.c2_out || '22:00';
    }

    function updateShiftTimeConfig() {
      shiftTimes.c1_in = document.getElementById('cfg_c1_in').value;
      shiftTimes.c1_out = document.getElementById('cfg_c1_out').value;
      shiftTimes.c2_in = document.getElementById('cfg_c2_in').value;
      shiftTimes.c2_out = document.getElementById('cfg_c2_out').value;
      localStorage.setItem('camp_shift_times', JSON.stringify(shiftTimes));
      showToast('Đã lưu giờ ca trực!');
    }

    function buildMonthWeeksList() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const firstOfMonth = new Date(year, month, 1);
      const dayOfWeekFirst = firstOfMonth.getDay();
      const mondayOffset = (dayOfWeekFirst === 0) ? -6 : (1 - dayOfWeekFirst);
      let curMonday = new Date(year, month, 1 + mondayOffset);

      monthWeeksList = [];
      let weekNum = 1;
      while (true) {
        let curSunday = new Date(curMonday);
        curSunday.setDate(curMonday.getDate() + 6);
        monthWeeksList.push({
          index: weekNum - 1,
          labelNumber: weekNum,
          monday: new Date(curMonday),
          sunday: new Date(curSunday)
        });
        if (curSunday.getMonth() !== month && curSunday > firstOfMonth) break;
        curMonday.setDate(curMonday.getDate() + 7);
        weekNum++;
      }

      const todayTime = new Date(year, month, now.getDate()).getTime();
      let defaultIdx = 0;
      monthWeeksList.forEach((w, idx) => {
        if (todayTime >= w.monday.getTime() && todayTime <= w.sunday.getTime()) defaultIdx = idx;
      });
      currentWeekIndex = defaultIdx;
      selectedSyncWeeks.clear();
      selectedSyncWeeks.add(currentWeekIndex);
    }

    function getWeekStorageKey(wIdx) {
      const w = monthWeeksList[wIdx];
      if (!w) return `shifts_w_${wIdx}`;
      return `camp_shifts_${w.monday.getFullYear()}_${w.monday.getMonth()+1}_${w.monday.getDate()}`;
    }

    function getShiftsForWeekIndex(wIdx) {
      const key = getWeekStorageKey(wIdx);
      const saved = localStorage.getItem(key);
      if (saved) return JSON.parse(saved);
      return JSON.parse(localStorage.getItem('camp_weekly_shifts') || JSON.stringify({
        2: "ca1", 3: "ca1", 4: "ca1", 5: "ca2", 6: "ca2", 7: "off", 8: "off"
      }));
    }

    function initMonthWeeksDropdown() {
      buildMonthWeeksList();
      const select = document.getElementById('weekDropdownSelect');
      select.innerHTML = '';
      monthWeeksList.forEach((w) => {
        const monLabel = `${w.monday.getDate()}/${w.monday.getMonth()+1}`;
        const sunLabel = `${w.sunday.getDate()}/${w.sunday.getMonth()+1}`;
        const opt = document.createElement('option');
        opt.value = w.index;
        opt.text = `Tuần ${w.labelNumber} (${monLabel} - ${sunLabel})`;
        if (w.index === currentWeekIndex) opt.selected = true;
        select.appendChild(opt);
      });
      renderSyncDropdownMenu();
    }

    function onWeekDropdownChange(val) {
      currentWeekIndex = parseInt(val, 10);
      renderWeekGrid();
      selectedSyncWeeks.clear();
      selectedSyncWeeks.add(currentWeekIndex);
      renderSyncDropdownMenu();
    }

    function renderWeekGrid() {
      const container = document.getElementById('weekGridContainer');
      container.innerHTML = '';
      const dayLabels = [
        { key: 2, label: 'T2' }, { key: 3, label: 'T3' }, { key: 4, label: 'T4' },
        { key: 5, label: 'T5' }, { key: 6, label: 'T6' }, { key: 7, label: 'T7' }, { key: 8, label: 'CN' }
      ];

      const now = new Date();
      const currentWeekObj = monthWeeksList[currentWeekIndex];
      if (!currentWeekObj) return;

      const shiftsData = getShiftsForWeekIndex(currentWeekIndex);

      dayLabels.forEach((d, idx) => {
        const dayDate = new Date(currentWeekObj.monday);
        dayDate.setDate(currentWeekObj.monday.getDate() + idx);

        const isToday = (dayDate.getDate() === now.getDate() && 
                         dayDate.getMonth() === now.getMonth() && 
                         dayDate.getFullYear() === now.getFullYear());

        const savedShift = shiftsData[d.key] || 'off';
        const dateLabel = `${String(dayDate.getDate()).padStart(2,'0')}/${String(dayDate.getMonth()+1).padStart(2,'0')}`;

        // Gán class chuẩn xác: Nghỉ -> is-off (Đỏ)
        let shiftClass = 'is-off';
        if (savedShift === 'ca1') shiftClass = 'is-ca1';
        else if (savedShift === 'ca2') shiftClass = 'is-ca2';

        const col = document.createElement('div');
        col.className = `day-col ${isToday ? 'today' : ''} ${shiftClass}`;
        col.id = `col-day-${d.key}`;
        col.innerHTML = `
          <div class="day-name">${d.label} ${isToday ? '●' : ''}</div>
          <span class="calendar-date">${dateLabel}</span>
          <select class="day-shift-select" onchange="updateShift(${d.key}, this.value)">
            <option value="off" ${savedShift === 'off' ? 'selected' : ''}>Nghỉ</option>
            <option value="ca1" ${savedShift === 'ca1' ? 'selected' : ''}>Ca 1</option>
            <option value="ca2" ${savedShift === 'ca2' ? 'selected' : ''}>Ca 2</option>
          </select>
        `;
        container.appendChild(col);
      });
    }

    function updateShift(dayKey, val) {
      const key = getWeekStorageKey(currentWeekIndex);
      const shiftsData = getShiftsForWeekIndex(currentWeekIndex);
      shiftsData[dayKey] = val;
      localStorage.setItem(key, JSON.stringify(shiftsData));
      localStorage.setItem('camp_weekly_shifts', JSON.stringify(shiftsData));

      const col = document.getElementById(`col-day-${dayKey}`);
      if (col) {
        col.classList.remove('is-off', 'is-ca1', 'is-ca2');
        if (val === 'ca1') col.classList.add('is-ca1');
        else if (val === 'ca2') col.classList.add('is-ca2');
        else col.classList.add('is-off');
      }
      showToast('Đã lưu ca làm!');
    }

    function copyCurrentWeekToAll() {
      const curData = getShiftsForWeekIndex(currentWeekIndex);
      if (confirm(`Áp dụng lịch tuần này cho toàn bộ các tuần trong tháng?`)) {
        monthWeeksList.forEach(w => localStorage.setItem(getWeekStorageKey(w.index), JSON.stringify(curData)));
        localStorage.setItem('camp_weekly_shifts', JSON.stringify(curData));
        renderWeekGrid();
        showToast('Đã nhân rộng lịch cả tháng!');
      }
    }

    function toggleSyncDropdown(e) {
      e.stopPropagation();
      document.getElementById('syncDropdownMenu').classList.toggle('show');
    }
    document.addEventListener('click', (e) => {
      const m = document.getElementById('syncDropdownMenu');
      if (m && m.classList.contains('show') && !e.target.closest('.custom-multiselect')) m.classList.remove('show');
    });

    function renderSyncDropdownMenu() {
      const menu = document.getElementById('syncDropdownMenu');
      menu.innerHTML = '';
      const isFullMonth = (selectedSyncWeeks.size === monthWeeksList.length);
      const mItem = document.createElement('div');
      mItem.className = `multiselect-item ${isFullMonth ? 'selected' : ''}`;
      mItem.innerHTML = `<span>📅 Chọn tất cả các tuần</span><span class="multiselect-check">✔</span>`;
      mItem.onclick = (e) => {
        e.stopPropagation();
        selectedSyncWeeks.clear();
        if (!isFullMonth) monthWeeksList.forEach(w => selectedSyncWeeks.add(w.index));
        renderSyncDropdownMenu();
      };
      menu.appendChild(mItem);

      monthWeeksList.forEach((w) => {
        const isSel = selectedSyncWeeks.has(w.index);
        const item = document.createElement('div');
        item.className = `multiselect-item ${isSel ? 'selected' : ''}`;
        item.innerHTML = `<span>Tuần ${w.labelNumber}</span><span class="multiselect-check">✔</span>`;
        item.onclick = (e) => {
          e.stopPropagation();
          if (selectedSyncWeeks.has(w.index)) selectedSyncWeeks.delete(w.index);
          else selectedSyncWeeks.add(w.index);
          renderSyncDropdownMenu();
        };
        menu.appendChild(item);
      });
      const lbl = document.getElementById('syncDropdownLabel');
      lbl.innerText = selectedSyncWeeks.size === 0 ? 'Chọn tuần...' : `Đã chọn (${selectedSyncWeeks.size} tuần)`;
    }

    // ĐỒNG BỘ LỊCH VỚI EMOJI MÀU
    function buildICSEvents(weekIndices, filterShift = 'all') {
      let events = [];
      function toUTCICSString(year, month, day, timeStr, addMinutes = 0) {
        const [h, m] = timeStr.split(':').map(Number);
        const dateObj = new Date(year, month - 1, day, h, m + addMinutes, 0);
        return dateObj.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      }

      weekIndices.forEach(wIdx => {
        const wObj = monthWeeksList[wIdx];
        if (!wObj) return;
        const shiftsData = getShiftsForWeekIndex(wIdx);

        for (let i = 0; i < 7; i++) {
          const dayKey = i === 6 ? 8 : i + 2;
          const shift = shiftsData[dayKey] || 'off';
          if (shift === 'off') continue;
          if (filterShift !== 'all' && shift !== filterShift) continue;

          const dayDate = new Date(wObj.monday);
          dayDate.setDate(wObj.monday.getDate() + i);
          const y = dayDate.getFullYear();
          const m = dayDate.getMonth() + 1;
          const d = dayDate.getDate();
          const dateStr = `${y}${String(m).padStart(2,'0')}${String(d).padStart(2,'0')}`;

          const isC1 = (shift === 'ca1');
          const rawIn = isC1 ? (shiftTimes.c1_in || '05:15') : (shiftTimes.c2_in || '13:15');
          const rawOut = isC1 ? (shiftTimes.c1_out || '14:00') : (shiftTimes.c2_out || '22:00');

          const tagIn = isC1 ? `🔵 [CA 1] VÀO CA (${rawIn})` : `🟡 [CA 2] VÀO CA (${rawIn})`;
          const tagOut = isC1 ? `🟦 [CA 1] TAN CA (${rawOut})` : `🟨 [CA 2] TAN CA (${rawOut})`;
          const hexColor = isC1 ? '#0284c7' : '#eab308';
          const catName = isC1 ? 'CA 1 (SÁNG)' : 'CA 2 (CHIỀU)';

          const inStartUTC = toUTCICSString(y, m, d, rawIn, 0);
          const inEndUTC = toUTCICSString(y, m, d, rawIn, 15);
          const outStartUTC = toUTCICSString(y, m, d, rawOut, 0);
          const outEndUTC = toUTCICSString(y, m, d, rawOut, 15);

          events.push([
            'BEGIN:VEVENT',
            `UID:in-${dateStr}-${dayKey}-${isC1?'c1':'c2'}@lantrai`,
            `DTSTAMP:${inStartUTC}`,
            `DTSTART:${inStartUTC}`,
            `DTEND:${inEndUTC}`,
            `SUMMARY:${tagIn}`,
            `DESCRIPTION:Bắt đầu ${isC1?'Ca 1':'Ca 2'} lúc ${rawIn}`,
            `CATEGORIES:${catName}`,
            `COLOR:${hexColor}`,
            `X-APPLE-CALENDAR-COLOR:${hexColor}`,
            'STATUS:CONFIRMED',
            'TRANSP:OPAQUE',
            'BEGIN:VALARM',
            'TRIGGER:-PT0M',
            'ACTION:DISPLAY',
            `DESCRIPTION:Báo giờ vào ca ${rawIn}`,
            'END:VALARM',
            'END:VEVENT'
          ].join('\r\n'));

          events.push([
            'BEGIN:VEVENT',
            `UID:out-${dateStr}-${dayKey}-${isC1?'c1':'c2'}@lantrai`,
            `DTSTAMP:${outStartUTC}`,
            `DTSTART:${outStartUTC}`,
            `DTEND:${outEndUTC}`,
            `SUMMARY:${tagOut}`,
            `DESCRIPTION:Kết thúc ${isC1?'Ca 1':'Ca 2'} lúc ${rawOut}`,
            `CATEGORIES:${catName}`,
            `COLOR:${hexColor}`,
            `X-APPLE-CALENDAR-COLOR:${hexColor}`,
            'STATUS:CONFIRMED',
            'TRANSP:OPAQUE',
            'BEGIN:VALARM',
            'TRIGGER:-PT0M',
            'ACTION:DISPLAY',
            `DESCRIPTION:Báo giờ tan ca ${rawOut}`,
            'END:VALARM',
            'END:VEVENT'
          ].join('\r\n'));
        }
      });
      return events;
    }

    function downloadICSFile(filename, events) {
      if (events.length === 0) {
        alert('Không có ca làm việc nào được chọn!');
        return;
      }
      const icsData = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//LanTrai//ShiftCalendar//VI',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        events.join('\r\n'),
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.URL.revokeObjectURL(link.href);
    }

    function executeSelectedSync(type = 'all') {
      if (selectedSyncWeeks.size === 0) {
        alert('Vui lòng chọn ít nhất 1 tuần!');
        return;
      }
      const weekIndices = Array.from(selectedSyncWeeks).sort((a, b) => a - b);
      const evs = buildICSEvents(weekIndices, type);
      downloadICSFile('lich_ca_truc.ics', evs);
      showToast('Đã tải tệp lịch 🔵/🟡! Mở tệp để thêm vào điện thoại.');
    }

    function exportSplitCalendars() {
      if (selectedSyncWeeks.size === 0) {
        alert('Vui lòng chọn tuần cần xuất!');
        return;
      }
      const weekIndices = Array.from(selectedSyncWeeks).sort((a, b) => a - b);
      const c1Events = buildICSEvents(weekIndices, 'ca1');
      const c2Events = buildICSEvents(weekIndices, 'ca2');

      if (c1Events.length > 0) downloadICSFile('Lich_CA_1_Xanh.ics', c1Events);
      setTimeout(() => {
        if (c2Events.length > 0) downloadICSFile('Lich_CA_2_Vang.ics', c2Events);
      }, 700);
      showToast('Đã tách thành 2 file Ca 1 và Ca 2 riêng!');
    }

    // 4. THỜI KHÓA BIỂU PHÂN BIỆT MỖI TIẾT 1 MÀU
    const lessonColorTags = [
      { class: 'tag-t1', name: 'Tiết 1' },
      { class: 'tag-t2', name: 'Tiết 2' },
      { class: 'tag-t3', name: 'Tiết 3' },
      { class: 'tag-t4', name: 'Tiết 4' },
      { class: 'tag-t5', name: 'Tiết 5' }
    ];

    function getSchoolKey() {
      return `${document.getElementById('schoolClass').value}_${document.getElementById('schoolShift').value}_${document.getElementById('schoolDay').value}`;
    }
    function getSchoolData() {
      try { return JSON.parse(localStorage.getItem('family_timetable_v1') || '{}'); } catch (_) { return {}; }
    }
    function renderSchoolTimetable() {
      const host = document.getElementById('schoolLessons');
      if (!host) return;
      const data = getSchoolData(), saved = data[getSchoolKey()] || ['','','','',''];
      
      host.innerHTML = lessonColorTags.map((t, i) => `
        <div class="lesson-input-row">
          <div class="lesson-tag ${t.class}">📖 ${t.name}</div>
          <input id="schoolLesson${i+1}" placeholder="Môn học / ghi chú tiết ${i+1}" value="${escapeHtml(saved[i] || '')}">
        </div>
      `).join('');
      renderSchoolTodaySummary();
    }
    function saveSchoolTimetable() {
      const data = getSchoolData();
      data[getSchoolKey()] = [1,2,3,4,5].map(n => document.getElementById('schoolLesson'+n).value.trim());
      localStorage.setItem('family_timetable_v1', JSON.stringify(data));
      showToast('Đã lưu thời khóa biểu!');
      renderSchoolTodaySummary();
    }
    function clearSchoolDay() {
      if (!confirm('Xóa buổi học này?')) return;
      const data = getSchoolData(); delete data[getSchoolKey()];
      localStorage.setItem('family_timetable_v1', JSON.stringify(data));
      renderSchoolTimetable(); showToast('Đã xóa buổi học.');
    }

    // XEM NHANH HÔM NAY: HUY HIỆU VÀNG NHẠT
    function renderSchoolTodaySummary() {
      const host = document.getElementById('schoolTodaySummary');
      if (!host) return;
      const data = getSchoolData(), day = new Date().getDay();
      const schoolDays = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];

      function formatShiftRows(shiftArr) {
        if (!shiftArr || !shiftArr.some(x => x && x.trim() !== '')) {
          return `<div style="color:var(--muted);font-style:italic;font-size:0.75rem;">Không có tiết</div>`;
        }
        return shiftArr.map((x, i) => {
          if (!x || !x.trim()) return '';
          return `<div class="quick-lesson-item"><span class="quick-lesson-badge">Tiết ${i+1}</span> <span>${escapeHtml(x)}</span></div>`;
        }).filter(Boolean).join('');
      }

      const rows = ['10','6'].map(cls => {
        const morning = data[`${cls}_morning_${day}`] || [];
        const afternoon = data[`${cls}_afternoon_${day}`] || [];
        return `
          <div style="padding:8px 10px; margin-bottom:8px; background:#f8fafc; border-radius:10px; border:1px solid var(--border)">
            <div style="font-weight:800; font-size:0.86rem; color:var(--primary-dark); margin-bottom:4px;">🏫 Lớp ${cls}</div>
            <div style="font-size:0.75rem; font-weight:700; color:#c2410c;">🌅 Buổi Sáng:</div>
            <div style="margin:2px 0 6px;">${formatShiftRows(morning)}</div>
            <div style="font-size:0.75rem; font-weight:700; color:#9d174d;">🌇 Buổi Chiều:</div>
            <div style="margin-top:2px;">${formatShiftRows(afternoon)}</div>
          </div>
        `;
      });
      host.innerHTML = `<div style="font-weight:750; font-size:0.82rem; margin-bottom:6px;">📅 ${schoolDays[day]} hôm nay:</div>` + rows.join('');
    }

    // 5. NHẬT KÝ & CÔNG VIỆC
    function saveJournalEntry() {
      const title = document.getElementById('journalTitle').value.trim();
      const content = document.getElementById('journalContent').value.trim();
      const category = document.getElementById('journalCategory').value;
      const reminderTime = document.getElementById('journalReminderTime').value;
      const journalDate = document.getElementById('journalDate').value || new Date().toISOString().split('T')[0];

      if (!title && !content) { alert('Vui lòng nhập nội dung!'); return; }
      initAudio();

      journals.unshift({
        id: Date.now(), title: title || 'Ghi chép trong ngày', content, category, journalDate, reminderTime, done: false,
        createdAt: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ' + new Date().toLocaleDateString('vi-VN')
      });
      localStorage.setItem('camp_journals_v1', JSON.stringify(journals));

      document.getElementById('journalTitle').value = '';
      document.getElementById('journalContent').value = '';
      document.getElementById('journalReminderTime').value = '';

      filterJournals();
      showToast('Đã lưu nhật ký!');
    }

    function filterJournals() {
      const keyword = (document.getElementById('searchKeyword').value || '').toLowerCase().trim();
      const dateVal = document.getElementById('filterJournalDate').value;

      let filtered = journals.filter(j => {
        let matchWord = true, matchDate = true;
        if (keyword) matchWord = (j.title || '').toLowerCase().includes(keyword) || (j.content || '').toLowerCase().includes(keyword);
        if (dateVal) matchDate = j.journalDate === dateVal;
        return matchWord && matchDate;
      });
      renderJournalList(filtered);
    }

    function clearJournalFilter() {
      document.getElementById('searchKeyword').value = '';
      document.getElementById('filterJournalDate').value = '';
      renderJournalList(journals);
    }

    function renderJournalList(listToRender) {
      const container = document.getElementById('journalListContainer');
      container.innerHTML = '';
      if (!listToRender || listToRender.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:16px; font-size:0.8rem;">Không có nhật ký.</div>`;
        return;
      }
      listToRender.forEach(item => {
        const div = document.createElement('div');
        div.className = `card-box`;
        div.style.marginBottom = '8px';
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <span style="font-size:0.7rem; font-weight:750; background:#fef08a; color:#854d0e; padding:1px 6px; border-radius:5px;">${escapeHtml(item.category)}</span>
            <span style="font-size:0.68rem; color:var(--muted);">${escapeHtml(item.createdAt)}</span>
          </div>
          <div style="font-weight:750; font-size:0.88rem;">${escapeHtml(item.title)}</div>
          <div style="font-size:0.8rem; color:#334155; margin-top:3px; white-space:pre-line;">${escapeHtml(item.content)}</div>
          <div style="display:flex; gap:6px; margin-top:6px;">
            <button onclick="deleteJournal(${item.id})" style="padding:4px 8px; border-radius:6px; border:1px solid #fecaca; color:red; background:#fff5f5; font-size:0.7rem; cursor:pointer;">Xóa</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function deleteJournal(id) {
      if (confirm('Xóa mục này?')) {
        journals = journals.filter(j => j.id !== id);
        localStorage.setItem('camp_journals_v1', JSON.stringify(journals));
        filterJournals();
      }
    }

    function saveIssue() {
      const title = document.getElementById('issueTitle').value.trim();
      const content = document.getElementById('issueContent').value.trim();
      const priority = document.getElementById('issuePriority').value;
      const reminderDateTime = document.getElementById('issueDateTime').value;

      if (!title) { alert('Vui lòng nhập tên công việc!'); return; }
      initAudio();

      issues.unshift({
        id: Date.now(), title, content, priority, reminderDateTime, done: false,
        createdAt: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ' + new Date().toLocaleDateString('vi-VN')
      });
      localStorage.setItem('camp_issues_v2', JSON.stringify(issues));

      document.getElementById('issueTitle').value = '';
      document.getElementById('issueContent').value = '';
      document.getElementById('issueDateTime').value = '';
      renderIssues();
      showToast('Đã thêm công việc!');
    }

    function renderIssues() {
      const el = document.getElementById('issuesList');
      el.innerHTML = '';
      if (issues.length === 0) {
        el.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:16px; font-size:0.8rem;">Không có việc cần làm.</div>`;
        return;
      }
      issues.forEach(item => {
        const div = document.createElement('div');
        div.className = `card-box`;
        div.style.marginBottom = '8px';
        div.innerHTML = `
          <div style="font-weight:750; font-size:0.88rem;">${escapeHtml(item.title)}</div>
          <div style="font-size:0.72rem; color:var(--muted);">${escapeHtml(item.createdAt)} | Mức độ: ${escapeHtml(item.priority)}</div>
          <div style="font-size:0.8rem; color:#334155; margin-top:3px;">${escapeHtml(item.content)}</div>
        `;
        el.appendChild(div);
      });
    }

    // 6. TIỆN ÍCH ÂM THANH & SAO LƯU
    function initAudio() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx && Ctx) audioCtx = new Ctx();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      } catch (_) {}
    }
    function playBeep() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
    function enableSoundTest() {
      initAudio(); playBeep();
      showToast('Chuông báo thử nghiệm đang kêu!');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg; t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2000);
    }
    function escapeHtml(t) {
      if (!t) return '';
      return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function exportData() {
      const data = { shiftTimes, journals, issues, familyTimetable: localStorage.getItem('family_timetable_v1') || '{}' };
      const a = document.createElement('a');
      a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
      a.download = `sotay_backup_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
    }
    function importData(e) {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = (evt) => {
        try {
          const d = JSON.parse(evt.target.result);
          if (d.shiftTimes) localStorage.setItem('camp_shift_times', JSON.stringify(d.shiftTimes));
          if (d.journals) localStorage.setItem('camp_journals_v1', JSON.stringify(d.journals));
          if (d.issues) localStorage.setItem('camp_issues_v2', JSON.stringify(d.issues));
          if (d.familyTimetable) localStorage.setItem('family_timetable_v1', typeof d.familyTimetable === 'string' ? d.familyTimetable : JSON.stringify(d.familyTimetable));
          location.reload();
        } catch(_) { alert('Tệp không hợp lệ!'); }
      };
      r.readAsText(f);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      const days = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
      document.getElementById('greetingDateLabel').innerText = `Hôm nay ${days[now.getDay()]}, ${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()}`;
      renderWeatherIcon('sunny');
      initMonthWeeksDropdown();
      renderWeekGrid();
      loadShiftTimeConfigUI();
      filterJournals();
      renderIssues();
      renderSchoolTimetable();
    });
    document.body.addEventListener('click', () => { initAudio(); }, { once: true });
  </script>
</body>
</html>
